<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Соберись!</title>
<!-- PWA / iPhone -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f7a5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Соберись!">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root{
    --bg:#f4f1ea; --card:#fffdf8; --ink:#2b2620; --muted:#8a8175;
    --line:#e7e0d3; --accent:#1f7a5c; --accent-soft:#e3f1ea;
    --done:#b7ac99; --warn:#c9822f; --warn-soft:#fbeedd; --red:#c14b3f;
    --shadow:0 1px 3px rgba(60,50,30,.08),0 6px 18px rgba(60,50,30,.06);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--ink);
    padding-bottom:calc(88px + env(safe-area-inset-bottom)); -webkit-font-smoothing:antialiased;
  }
  /* ---- Lock screen ---- */
  #lock{
    position:fixed; inset:0; z-index:100; background:var(--bg);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; padding:24px;
  }
  #lock.hidden{display:none}
  #lock .logo{font-size:52px}
  #lock h2{margin:0; font-size:20px; font-weight:700}
  #lock p{margin:0; font-size:13px; color:var(--muted); text-align:center; max-width:280px; line-height:1.5}
  #lock .row{display:flex; gap:8px; width:100%; max-width:300px; margin-top:6px}
  #lock button{
    border:0; background:var(--accent); color:#fff; font-family:inherit; font-weight:700; font-size:16px;
    padding:0 18px; border-radius:12px; cursor:pointer;
  }
  #lock .err{color:var(--red); font-size:12.5px; font-weight:600; min-height:16px; text-align:center; max-width:300px; line-height:1.4}
  /* ---- App ---- */
  header{position:sticky; top:0; z-index:20; background:var(--bg); padding:calc(12px + env(safe-area-inset-top)) 16px 9px; border-bottom:1px solid var(--line)}
  .h-row{display:flex; align-items:center; justify-content:space-between; gap:10px}
  h1{font-size:18px; margin:0; font-weight:700; letter-spacing:-.2px}
  .h-right{display:flex; align-items:center; gap:8px}
  .date{font-size:11.5px; color:var(--muted); font-weight:600}
  .editbtn{border:1px solid var(--line); background:var(--card); color:var(--muted); font-family:inherit; font-size:12px; font-weight:700; padding:6px 12px; border-radius:99px; cursor:pointer}
  body.editmode .editbtn{background:var(--accent); border-color:var(--accent); color:#fff}
  .bar{height:8px; background:var(--line); border-radius:99px; margin-top:11px; overflow:hidden}
  .bar > i{display:block; height:100%; width:0; background:var(--accent); border-radius:99px; transition:width .35s ease}
  .bar-lbl{font-size:11px; color:var(--muted); font-weight:600}
  .bar-row{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:6px}
  .donetoggle{border:0; background:none; font-family:inherit; font-size:11.5px; font-weight:700; color:var(--accent); cursor:pointer; padding:2px 0; flex:none; white-space:nowrap}
  .donetoggle:active{opacity:.6}
  .donetoggle.hidden{display:none}
  .hbtn{width:34px; height:34px; flex:none; border:1px solid var(--line); background:var(--card); color:var(--muted); border-radius:10px; display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0}
  .hbtn svg{width:19px; height:19px}
  .hbtn:active{background:var(--bg)}
  body.editmode #editBtn{background:var(--accent); border-color:var(--accent); color:#fff}
  nav{position:fixed; bottom:0; left:0; right:0; z-index:30; display:flex; flex-wrap:nowrap; overflow-x:auto; overflow-y:hidden; scrollbar-width:none; background:var(--card); border-top:1px solid var(--line); box-shadow:0 -2px 12px rgba(60,50,30,.06); padding-bottom:env(safe-area-inset-bottom)}
  nav::-webkit-scrollbar{display:none}
  nav button{flex:1 0 auto; min-width:calc(100%/6); border:0; background:none; padding:7px 2px 8px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--muted); font-family:inherit; position:relative}
  nav button .ic{font-size:19px; line-height:1; width:40px; height:30px; display:flex; align-items:center; justify-content:center; border-radius:11px; transition:background .15s}
  nav button .tx{font-size:10px; font-weight:600; letter-spacing:-.2px; white-space:nowrap; max-width:62px; overflow:hidden; text-overflow:ellipsis}
  nav button.on{color:var(--accent)}
  nav button.on .ic{background:var(--accent-soft)}
  nav button.on .tx{font-weight:800}
  nav button .dot{position:absolute; top:2px; right:calc(50% - 24px); min-width:15px; height:15px; background:var(--warn); color:#fff; border-radius:99px; font-size:9.5px; font-weight:700; display:flex; align-items:center; justify-content:center; padding:0 4px}
  nav button.done .dot{background:var(--accent)}
  @media(min-width:680px){ nav{padding-left:calc(50% - 320px); padding-right:calc(50% - 320px)} }
  main{padding:14px 14px 20px; max-width:640px; margin:0 auto}
  .page{display:none; animation:fade .25s ease}
  .page.on{display:block}
  @keyframes fade{from{opacity:0; transform:translateY(4px)}to{opacity:1; transform:none}}
  .group{background:var(--card); border:1px solid var(--line); border-radius:16px; margin-bottom:14px; box-shadow:var(--shadow); overflow:hidden}
  .g-head{display:flex; align-items:center; gap:9px; padding:13px 15px; cursor:pointer; user-select:none}
  .g-head .emo{font-size:17px}
  .g-head .ttl{font-weight:700; font-size:14.5px; flex:1; letter-spacing:-.2px}
  .g-head .cnt{font-size:11.5px; color:var(--muted); font-weight:700; background:var(--bg); padding:3px 9px; border-radius:99px}
  .g-head .cnt.full{background:var(--accent-soft); color:var(--accent)}
  .g-head .chev{color:var(--muted); font-size:12px; transition:transform .2s; margin-left:2px}
  .group.closed .chev{transform:rotate(-90deg)}
  .group.closed .items{display:none}
  .items{padding:2px 6px 6px}
  .item{display:flex; align-items:flex-start; gap:11px; padding:11px 10px; border-radius:11px; cursor:pointer; transition:background .12s}
  .item:active{background:var(--bg)}
  .box{flex:none; width:23px; height:23px; border:2px solid var(--line); border-radius:7px; margin-top:1px; display:flex; align-items:center; justify-content:center; transition:all .15s; background:#fff}
  .box svg{width:14px; height:14px; opacity:0; transform:scale(.5); transition:all .15s}
  .item.checked .box{background:var(--accent); border-color:var(--accent)}
  .item.checked .box svg{opacity:1; transform:none}
  .lbl-wrap{flex:1; min-width:0; padding-top:1px; cursor:pointer}
  .lbl{font-size:14.5px; line-height:1.35; display:block}
  .item.checked .lbl{color:var(--done); text-decoration:line-through; text-decoration-color:var(--done)}
  .note{font-size:11.5px; color:var(--muted); font-weight:500; margin-top:3px; line-height:1.35; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
  .item.checked .note{color:var(--done); text-decoration:none}
  .sub{font-size:13px; font-weight:800; color:var(--accent); text-transform:uppercase; letter-spacing:.4px; padding:18px 6px 8px; display:flex; align-items:center; gap:8px}
  .sub::before{content:''; width:16px; height:3px; background:var(--accent); border-radius:2px; opacity:.55}
  .intro{font-size:12.5px; color:var(--muted); line-height:1.5; padding:2px 6px 10px}
  .loading{font-size:13px; color:var(--muted); text-align:center; padding:40px 12px}
  .acts{display:none; gap:6px; flex:none}
  body.editmode .acts{display:flex}
  body.editmode .item{cursor:default}
  body.editmode .item .box{opacity:.35}
  .act{width:30px; height:30px; border-radius:8px; border:1px solid var(--line); background:#fff; cursor:pointer; font-size:14px; display:flex; align-items:center; justify-content:center; padding:0}
  .act.del{color:var(--red); border-color:#e6cfc9}
  /* Кнопка-комментарий (в обычном режиме) */
  .cmt{display:flex; width:30px; height:30px; flex:none; align-items:center; justify-content:center; border:0; background:none; color:var(--muted); font-size:15px; cursor:pointer; opacity:.5; border-radius:8px; padding:0}
  .cmt:active{background:var(--bg); opacity:1}
  body.editmode .cmt{display:none}
  /* Ручка перетаскивания (в режиме правки) */
  .drag{display:none; width:30px; height:30px; flex:none; align-items:center; justify-content:center; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--muted); font-size:15px; touch-action:none; cursor:grab; padding:0; user-select:none}
  body.editmode .drag{display:flex}
  .item.dragging{opacity:.35}
  .drag-clone{position:fixed; z-index:200; pointer-events:none; box-shadow:0 10px 26px rgba(40,30,10,.22); background:var(--card); border:1.5px solid var(--accent); border-radius:11px; margin:0; padding:11px 10px; opacity:.97}
  .item.drop-before{box-shadow:inset 0 3px 0 -1px var(--accent)}
  /* Добавление задачи — всегда доступно, без «Править» */
  .additem{display:flex; align-items:center; gap:9px; padding:11px 12px; margin:2px 6px 6px; border:1.5px dashed var(--line); border-radius:11px; background:var(--card); cursor:pointer}
  .additem:active{background:var(--accent-soft)}
  .additem .addtx{color:var(--accent); font-weight:700; font-size:14px}
  .additem .plus{font-weight:800; font-size:16px; color:var(--accent); flex:none}
  .additem input{flex:1; min-width:0; border:0; background:none; font-family:inherit; font-size:14.5px; color:var(--ink); padding:3px 0}
  .additem input:focus{outline:none}
  .additem input::placeholder{color:var(--accent); opacity:.7; font-weight:700}
  .newgrp{display:none; align-items:center; gap:8px; padding:11px 12px; margin:4px 4px 14px; border:1.5px dashed var(--accent); border-radius:12px; color:var(--accent); font-weight:700; font-size:13px; cursor:pointer; background:var(--card); justify-content:center}
  body.editmode .newgrp{display:flex}
  .foot{text-align:center; padding:8px 0 4px; display:flex; flex-direction:column; gap:8px; align-items:center}
  .reset{background:none; border:1px solid var(--line); color:var(--muted); font-family:inherit; font-size:12px; font-weight:600; padding:9px 16px; border-radius:99px; cursor:pointer}
  .reset:active{background:var(--card)}
  .hint{font-size:11.5px; color:var(--muted); text-align:center; margin-top:2px; line-height:1.5}
  /* ---- Заголовок-поездка ---- */
  .trip-title{display:flex; align-items:center; gap:6px; border:0; background:none; font-family:inherit; color:var(--ink); font-size:18px; font-weight:700; letter-spacing:-.2px; padding:0; cursor:pointer; max-width:72vw; overflow:hidden}
  .trip-title #tripName{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .trip-title .chev-d{font-size:15px; line-height:1; color:var(--muted); font-weight:700; flex:none; margin-top:1px}
  .trip-meta{font-size:11.5px; color:var(--muted); font-weight:600; margin-top:4px; min-height:14px}
  .trip-meta .cd{color:var(--accent)}
  /* ---- Экран поездок ---- */
  #trips{position:fixed; inset:0; z-index:80; background:var(--bg); display:flex; flex-direction:column; padding:calc(12px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom)); overflow-y:auto; -webkit-overflow-scrolling:touch; animation:fade .2s ease}
  #trips.hidden{display:none}
  .trips-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px}
  .trips-head h2{margin:0; font-size:21px; font-weight:700; letter-spacing:-.3px}
  .trips-head .x{border:0; background:none; color:var(--muted); font-family:inherit; font-size:15px; font-weight:600; cursor:pointer; padding:6px 4px}
  .newtrip-btn{display:flex; align-items:center; justify-content:center; gap:8px; width:100%; border:0; background:var(--accent); color:#fff; font-family:inherit; font-weight:700; font-size:15px; padding:14px; border-radius:14px; cursor:pointer; margin-bottom:16px; box-shadow:var(--shadow)}
  .newtrip-btn:active{opacity:.9}
  .trip-card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px 15px; margin-bottom:12px; box-shadow:var(--shadow); cursor:pointer; position:relative}
  .trip-card.active{border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft), var(--shadow)}
  .trip-card:active{transform:scale(.995)}
  .trip-card.tpl{border-style:dashed; border-color:var(--accent); background:linear-gradient(180deg,var(--accent-soft),var(--card))}
  .tc-badge.tpl{color:var(--muted); background:var(--bg)}
  .tc-top{display:flex; align-items:center; gap:8px}
  .tc-name{font-size:16px; font-weight:700; flex:1; letter-spacing:-.2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .tc-badge{font-size:10.5px; font-weight:700; color:var(--accent); background:var(--accent-soft); padding:3px 8px; border-radius:99px; flex:none}
  .tc-dates{font-size:12px; color:var(--muted); font-weight:600; margin-top:4px}
  .tc-bar{height:6px; background:var(--line); border-radius:99px; margin-top:10px; overflow:hidden}
  .tc-bar > i{display:block; height:100%; width:0; background:var(--accent); border-radius:99px}
  .tc-lbl{font-size:11px; color:var(--muted); font-weight:600; margin-top:6px}
  .tc-acts{display:flex; gap:6px; margin-top:11px}
  .tc-acts button{flex:1; min-width:0; display:flex; align-items:center; justify-content:center; gap:5px; white-space:nowrap; border:1px solid var(--line); background:#fff; color:var(--muted); font-family:inherit; font-size:12px; font-weight:700; padding:8px 6px; border-radius:9px; cursor:pointer}
  .tc-acts button.del{color:var(--red); border-color:#e6cfc9; flex:none; min-width:38px; padding-left:0; padding-right:0}
  .trips-empty{text-align:center; color:var(--muted); font-size:13px; padding:30px 12px; line-height:1.55}
  /* ---- Bottom sheet (новая/изменить поездка) ---- */
  .sheet-back{position:fixed; inset:0; z-index:90; background:rgba(30,25,15,.35); display:flex; align-items:flex-end; justify-content:center; opacity:0; transition:opacity .2s ease}
  .sheet-back.show{opacity:1}
  .sheet-back.hidden{display:none}
  .sheet-card{width:100%; max-width:640px; background:var(--card); border-radius:20px 20px 0 0; padding:8px 18px calc(18px + env(safe-area-inset-bottom)); box-shadow:0 -8px 30px rgba(40,30,10,.18); transform:translateY(100%); transition:transform .24s cubic-bezier(.2,.8,.2,1); max-height:92vh; overflow-y:auto; -webkit-overflow-scrolling:touch}
  .sheet-back.show .sheet-card{transform:none}
  .sheet-grip{width:40px; height:5px; background:var(--line); border-radius:99px; margin:6px auto 12px}
  .sheet-card h3{margin:0 0 14px; font-size:18px; font-weight:700; letter-spacing:-.2px}
  .fld{display:block; margin-bottom:12px}
  .fld > span, .fld-lbl{display:block; font-size:12px; font-weight:700; color:var(--muted); margin-bottom:6px}
  .fld input, .sel{width:100%; border:1.5px solid var(--line); background:#fff; border-radius:11px; padding:12px 13px; font-family:inherit; font-size:16px; color:var(--ink); -webkit-appearance:none; appearance:none}
  .fld input:focus, .sel:focus{outline:none; border-color:var(--accent)}
  .fld-row{display:flex; gap:10px}
  .fld-row .fld{flex:1; min-width:0}
  .seg{display:flex; gap:6px; background:var(--bg); padding:4px; border-radius:12px; margin-bottom:10px}
  .seg-b{flex:1; border:0; background:none; font-family:inherit; font-size:13.5px; font-weight:700; color:var(--muted); padding:9px; border-radius:9px; cursor:pointer}
  .seg-b.on{background:var(--card); color:var(--accent); box-shadow:var(--shadow)}
  .sel.hidden{display:none}
  .sheet-acts{display:flex; gap:10px; margin-top:8px}
  .btn-ghost{flex:1; border:1px solid var(--line); background:#fff; color:var(--muted); font-family:inherit; font-weight:700; font-size:15px; padding:13px; border-radius:12px; cursor:pointer}
  .btn-main{flex:2; border:0; background:var(--accent); color:#fff; font-family:inherit; font-weight:700; font-size:15px; padding:13px; border-radius:12px; cursor:pointer}
  .btn-main:active,.btn-ghost:active{opacity:.9}
  /* ---- Редактор категорий/подкатегорий ---- */
  .cat-edit{display:none; align-items:center; gap:9px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:9px 12px; margin-bottom:12px; box-shadow:var(--shadow)}
  body.editmode .cat-edit{display:flex}
  .cat-edit .ce-emo{font-size:18px; flex:none}
  .cat-edit .ce-name{flex:1; font-weight:700; font-size:14.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .cat-edit button{width:32px; height:32px; flex:none; border-radius:8px; border:1px solid var(--line); background:#fff; cursor:pointer; font-size:14px; padding:0}
  .cat-edit button.del{color:var(--red); border-color:#e6cfc9}
  .g-acts{display:none; gap:6px; margin-left:2px; flex:none}
  body.editmode .g-acts{display:flex}
  .g-acts button{width:28px; height:28px; border-radius:7px; border:1px solid var(--line); background:#fff; cursor:pointer; font-size:12.5px; padding:0}
  .g-acts button.del{color:var(--red); border-color:#e6cfc9}
  .newcat{display:none; align-items:center; justify-content:center; gap:8px; padding:11px 12px; margin:2px 4px 16px; border:1.5px dashed var(--accent); border-radius:12px; color:var(--accent); font-weight:700; font-size:13px; cursor:pointer; background:var(--card)}
  body.editmode .newcat{display:flex}
  /* ---- Эмодзи-пикер ---- */
  .emoji-cur{display:flex; align-items:center; gap:11px; margin:2px 0 10px}
  .emoji-cur .cur{font-size:28px; width:52px; height:52px; flex:none; display:flex; align-items:center; justify-content:center; border:1.5px solid var(--line); border-radius:12px; background:#fff}
  .emoji-cur .txt{font-size:11.5px; color:var(--muted); font-weight:600; line-height:1.4}
  .emoji-sug{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:10px}
  .emoji-sug:empty{display:none}
  .emoji-sug .es{font-size:21px; width:42px; height:42px; border:1.5px solid var(--accent); background:var(--accent-soft); border-radius:10px; cursor:pointer; display:flex; align-items:center; justify-content:center}
  .emoji-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:5px; max-height:184px; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:8px; margin-bottom:12px; border:1px solid var(--line); border-radius:12px; background:var(--bg)}
  .emoji-grid .eg{font-size:21px; height:40px; border:0; background:none; border-radius:9px; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0}
  .emoji-grid .eg.on{background:var(--accent-soft); box-shadow:inset 0 0 0 1.5px var(--accent)}
  .emoji-grid .eg:active{background:var(--card)}
  /* ---- Профиль ---- */
  .prof-avatar{width:34px; height:34px; border-radius:99px; border:1px solid var(--line); background:var(--card); color:var(--accent); font-weight:800; font-size:15px; display:flex; align-items:center; justify-content:center; cursor:pointer; flex:none; padding:0}
  #profile{position:fixed; inset:0; z-index:85; background:var(--bg); display:flex; flex-direction:column; padding:calc(12px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom)); overflow-y:auto; -webkit-overflow-scrolling:touch; animation:fade .2s ease}
  #profile.hidden{display:none}
  .prof-hint{font-size:12.5px; color:var(--muted); line-height:1.5; margin:-2px 0 12px; background:var(--accent-soft); padding:11px 13px; border-radius:12px}
  .prof-sec{font-size:12px; font-weight:800; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; margin:20px 2px 9px}
  .prof-cat{display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:11px 13px; margin-bottom:8px; box-shadow:var(--shadow)}
  .prof-cat .pc-emo{font-size:18px; flex:none}
  .prof-cat .pc-name{flex:1; font-weight:700; font-size:14.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .prof-cat button{width:32px; height:32px; flex:none; border-radius:8px; border:1px solid var(--line); background:#fff; cursor:pointer; font-size:14px; padding:0}
  .prof-cat button.del{color:var(--red); border-color:#e6cfc9}
  .prof-logout{margin-top:24px; width:100%; border:1px solid #e6cfc9; background:#fff; color:var(--red); font-family:inherit; font-weight:700; font-size:15px; padding:14px; border-radius:12px; cursor:pointer}
  .prof-store{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 13px; box-shadow:var(--shadow)}
  .prof-cat .ghandle{display:flex}
  .prof-cat.dragging{opacity:.35}
  /* ---- Окно задачи (Todoist-стиль) ---- */
  .ts-head{display:flex; align-items:center; justify-content:space-between; margin:0 0 14px}
  .ts-head h3{margin:0}
  .ts-del{border:0; background:none; color:var(--red); font-family:inherit; font-weight:700; font-size:13.5px; cursor:pointer; padding:6px 4px; display:flex; align-items:center; gap:5px}
  .ts-del.hidden{display:none}
  .fld textarea{width:100%; border:1.5px solid var(--line); background:#fff; border-radius:11px; padding:12px 13px; font-family:inherit; font-size:15px; color:var(--ink); line-height:1.4; resize:vertical; min-height:88px}
  .fld textarea:focus{outline:none; border-color:var(--accent)}
  /* ---- Перетаскивание: плейсхолдер-«разрыв» ---- */
  .drag-ph{margin:2px 6px; border:1.5px dashed var(--accent); border-radius:11px; background:var(--accent-soft); pointer-events:none}
  .drag-ph.grp{margin:0 0 14px; min-height:54px}
  .drag-ph.tplph{margin:0 0 12px}
  body.dragging{ -webkit-user-select:none; user-select:none }
  body.editmode .item, body.editmode .group, body.editmode .sub, .prof-cat, .trip-card{ -webkit-user-select:none; user-select:none; -webkit-touch-callout:none }
  body.noscroll{overflow:hidden}
  .sheet-card, .vlist, .emoji-grid, #profile, #trips{ overscroll-behavior:contain }
  .trip-card .ghandle{display:flex; margin-right:2px}
  /* ---- Ручка перетаскивания у подкатегорий и категорий ---- */
  .ghandle{display:none; width:28px; height:28px; flex:none; align-items:center; justify-content:center; border:1px solid var(--line); border-radius:7px; background:#fff; color:var(--muted); font-size:13px; touch-action:none; cursor:grab; padding:0; user-select:none}
  body.editmode .ghandle{display:flex}
  .group.dragging, .sub.dragging{opacity:.35}
  /* ---- Секция-заголовок в правке ---- */
  .sub{position:relative}
  .sub .sub-tx{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .sub-acts{display:none; gap:6px; flex:none; margin-left:auto}
  body.editmode .sub-acts{display:flex}
  .sub-acts button{width:26px; height:26px; border-radius:7px; border:1px solid var(--line); background:#fff; cursor:pointer; font-size:12px; padding:0; color:var(--muted)}
  .sub-acts button.del{color:var(--red); border-color:#e6cfc9}
  .newsub{display:none; align-items:center; justify-content:center; gap:8px; padding:10px 12px; margin:2px 4px 14px; border:1.5px dashed var(--muted); border-radius:12px; color:var(--muted); font-weight:700; font-size:13px; cursor:pointer; background:var(--card)}
  body.editmode .newsub{display:flex}
  /* ---- Кнопка «Посмотреть списком» у категории ---- */
  .viewcat{display:flex; align-items:center; justify-content:center; gap:7px; width:100%; border:1px solid var(--line); background:var(--card); color:var(--accent); font-family:inherit; font-weight:700; font-size:13px; padding:10px; border-radius:12px; cursor:pointer; margin-bottom:12px}
  .viewcat:active{background:var(--accent-soft)}
  /* ---- Окно «Посмотреть списком» ---- */
  .vlist{-webkit-overflow-scrolling:touch}
  .vlist .vg{font-weight:800; font-size:13px; color:var(--accent); margin:14px 0 6px; text-transform:uppercase; letter-spacing:.3px}
  .vlist .vg:first-child{margin-top:0}
  .vlist .vi{display:flex; gap:8px; align-items:flex-start; padding:6px 0; font-size:14.5px; line-height:1.35; border-bottom:1px solid var(--line)}
  .vlist .vi .mk{flex:none; width:18px; color:var(--accent); font-weight:800}
  .vlist .vi.off .mk{color:var(--line)}
  .vlist .vi.off{color:var(--muted)}
  .vlist .vi .vn{display:block; font-size:11.5px; color:var(--muted); font-weight:500; margin-top:2px}
  /* ---- Вкладки Поездки / Шаблоны ---- */
  .trips-tabs{display:flex; gap:6px; background:var(--card); border:1px solid var(--line); padding:4px; border-radius:12px; margin-bottom:14px}
  .trips-tabs button{flex:1; border:0; background:none; font-family:inherit; font-size:14px; font-weight:700; color:var(--muted); padding:9px; border-radius:9px; cursor:pointer}
  .trips-tabs button.on{background:var(--accent); color:#fff}
  /* ---- Своё эмодзи ---- */
  .emoji-own{display:flex; gap:8px; margin-bottom:10px}
  .emoji-own input{flex:1; min-width:0; border:1.5px solid var(--line); background:#fff; border-radius:11px; padding:10px 12px; font-family:inherit; font-size:18px; text-align:center; color:var(--ink)}
  .emoji-own input:focus{outline:none; border-color:var(--accent)}
  .emoji-own button{flex:none; border:0; background:var(--accent-soft); color:var(--accent); font-family:inherit; font-weight:700; font-size:13px; padding:0 14px; border-radius:11px; cursor:pointer}
</style>
</head>
<body>

<!-- ===== ЭКРАН ВХОДА ===== -->
<div id="lock">
  <div class="logo">🧳</div>
  <h2>Соберись!</h2>
  <p id="lockMsg">Войдите, чтобы открыть список</p>
  <div class="row" style="justify-content:center">
    <button id="gsi" onclick="doSignIn()" style="display:flex; align-items:center; gap:9px; background:#fff; color:#2b2620; border:1.5px solid var(--line); padding:12px 18px; font-weight:700; font-size:15px">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      Войти через Google
    </button>
  </div>
  <div class="err" id="pwErr"></div>
  <div id="signout" style="display:none; margin-top:4px">
    <button class="reset" onclick="doSignOut()">Выйти и войти другим аккаунтом</button>
  </div>
</div>

<!-- ===== ПРИЛОЖЕНИЕ ===== -->
<div id="app" style="display:none">
  <header>
    <div class="h-row">
      <button class="trip-title" onclick="openTrips()"><span id="tripName">Поездка</span><span class="chev-d">▾</span></button>
      <div class="h-right">
        <button class="hbtn" id="viewBtn" onclick="openViewCurrent()" aria-label="Показать списком" title="Показать списком"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg></button>
        <button class="hbtn" id="editBtn" onclick="toggleEdit()" aria-label="Править" title="Править"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
        <button class="prof-avatar" id="profBtn" onclick="openProfile(false)">👤</button>
      </div>
    </div>
    <div class="trip-meta" id="tripMeta"></div>
    <div class="bar"><i id="totalBar"></i></div>
    <div class="bar-row">
      <span class="bar-lbl" id="totalLbl">—</span>
      <button class="donetoggle hidden" id="doneToggle" onclick="toggleHideDone()">Скрыть выполненные</button>
    </div>
  </header>
  <main>
    <div id="pages"></div>
    <div class="foot">
      <div class="hint" id="hint"></div>
    </div>
  </main>
  <nav id="tabs"></nav>
</div>

<!-- ===== ЭКРАН ПОЕЗДОК ===== -->
<div id="trips" class="hidden">
  <div class="trips-head">
    <h2>Мои списки</h2>
    <button class="x" onclick="closeTrips()">Закрыть</button>
  </div>
  <div class="trips-tabs">
    <button id="ttTrips" class="on" onclick="setTripsTab('trips')">Поездки</button>
    <button id="ttTpl" onclick="setTripsTab('templates')">Шаблоны</button>
  </div>
  <div id="tripList"></div>
</div>

<!-- ===== ЭКРАН ПРОФИЛЯ ===== -->
<div id="profile" class="hidden">
  <div class="trips-head">
    <h2>Профиль</h2>
    <button class="x" onclick="closeProfile()">Закрыть</button>
  </div>
  <div class="prof-hint" id="profHint" style="display:none"></div>
  <label class="fld"><span>Ваше имя</span>
    <input id="profName" type="text" placeholder="Например, Артём" autocomplete="off" enterkeyhint="done" oninput="saveProfName()">
  </label>
  <div class="prof-sec">Категории — <span id="profTripName">поездка</span></div>
  <div id="profCats"></div>
  <button class="newtrip-btn" style="margin-top:4px" onclick="openCatEditor(null)">＋ Категория</button>
  <div class="prof-sec">Облачное хранилище</div>
  <div class="prof-store" id="profStore"></div>
  <button class="prof-logout" onclick="doSignOut()">⎋ Выйти из аккаунта</button>
</div>

<!-- ===== BOTTOM SHEET: новая / изменить поездку ===== -->
<div id="sheet" class="sheet-back hidden" onclick="if(event.target===this) closeSheet()">
  <div class="sheet-card">
    <div class="sheet-grip"></div>
    <h3 id="sheetTitle">Новая поездка</h3>
    <label class="fld"><span>Локация</span>
      <input id="fLoc" type="text" placeholder="Например, Абхазия" autocomplete="off" enterkeyhint="done">
    </label>
    <div class="fld-row">
      <label class="fld"><span>Дата начала</span><input id="fFrom" type="date"></label>
      <label class="fld"><span>Дата конца</span><input id="fTo" type="date"></label>
    </div>
    <div id="sheetSource">
      <span class="fld-lbl">Из чего создать</span>
      <div class="seg">
        <button type="button" id="srcEmpty" class="seg-b on" onclick="setSource('empty')">Пустой</button>
        <button type="button" id="srcTpl" class="seg-b" onclick="setSource('template')">Шаблон</button>
        <button type="button" id="srcCopy" class="seg-b" onclick="setSource('copy')">Копия</button>
      </div>
      <select id="fTpl" class="sel hidden"></select>
      <select id="fCopy" class="sel hidden"></select>
    </div>
    <div class="sheet-acts">
      <button class="btn-ghost" onclick="closeSheet()">Отмена</button>
      <button class="btn-main" id="sheetSave" onclick="saveSheet()">Создать</button>
    </div>
  </div>
</div>

<!-- ===== BOTTOM SHEET: категория / подкатегория ===== -->
<div id="esheet" class="sheet-back hidden" onclick="if(event.target===this) closeESheet()">
  <div class="sheet-card">
    <div class="sheet-grip"></div>
    <h3 id="esTitle">Категория</h3>
    <label class="fld"><span id="eNameLbl">Название</span>
      <input id="eName" type="text" placeholder="Например, Вещи" autocomplete="off" enterkeyhint="done" oninput="suggestEmoji()">
    </label>
    <div id="esEmojiBlock">
      <span class="fld-lbl">Эмодзи</span>
      <div class="emoji-cur"><span class="cur" id="eEmojiCur">📋</span><span class="txt">Подсказки по названию, вставьте своё эмодзи или выберите из списка.</span></div>
      <div class="emoji-own">
        <input id="eOwn" type="text" placeholder="Своё эмодзи" maxlength="4" autocomplete="off">
        <button type="button" onclick="applyOwnEmoji()">Поставить</button>
      </div>
      <div id="emojiSug" class="emoji-sug"></div>
      <div id="emojiGrid" class="emoji-grid"></div>
    </div>
    <div class="sheet-acts">
      <button class="btn-ghost" onclick="closeESheet()">Отмена</button>
      <button class="btn-main" onclick="saveESheet()">Сохранить</button>
    </div>
  </div>
</div>

<!-- ===== BOTTOM SHEET: задача (Todoist-стиль) ===== -->
<div id="tsheet" class="sheet-back hidden" onclick="if(event.target===this) closeTaskSheet()">
  <div class="sheet-card">
    <div class="sheet-grip"></div>
    <div class="ts-head">
      <h3 id="tsTitle">Задача</h3>
      <button class="ts-del" id="tsDel" onclick="deleteTaskFromSheet()">🗑 Удалить</button>
    </div>
    <label class="fld"><span>Заголовок</span>
      <input id="tsName" type="text" placeholder="Что взять / сделать" autocomplete="off" enterkeyhint="done">
    </label>
    <label class="fld"><span>Комментарий</span>
      <textarea id="tsNote" placeholder="Детали, количество, напоминание…"></textarea>
    </label>
    <div class="sheet-acts">
      <button class="btn-ghost" onclick="closeTaskSheet()">Отмена</button>
      <button class="btn-main" onclick="saveTaskSheet()">ОК</button>

  </div>
</div>

<!-- ===== BOTTOM SHEET: посмотреть списком ===== -->
<div id="vsheet" class="sheet-back hidden" onclick="if(event.target===this) closeViewSheet()">
  <div class="sheet-card">
    <div class="sheet-grip"></div>
    <div class="ts-head"><h3 id="vsTitle">Список</h3>
      <button class="ts-del" style="color:var(--muted)" onclick="closeViewSheet()">Закрыть</button></div>
    <div class="vlist" id="vsBody"></div>
  </div>
</div>

<script>
/* ================= ДОСТУП (только вход через Google) =================
   В коде НЕТ ни списка разрешённых email, ни содержимого списка.
   Кто имеет доступ к данным — решают серверные правила Firestore. */
function doSignIn(){ document.getElementById('pwErr').textContent=''; if(window.AUTH) window.AUTH.signIn(); }
function doSignOut(){ if(window.AUTH) window.AUTH.signOut(); }
window.onSignInError=function(code){
  document.getElementById('pwErr').textContent = (code==='auth/popup-blocked')
    ? 'Разрешите всплывающие окна и нажмите «Войти» ещё раз.'
    : 'Не удалось войти. Нажмите «Войти» ещё раз.';
};

let __authedUser=null;
function showLogin(){
  document.getElementById('lock').classList.remove('hidden');
  document.getElementById('app').style.display='none';
  ['profile','trips'].forEach(id=>document.getElementById(id).classList.add('hidden'));
  profileOpen=false; tripsOpen=false; resetScrollLocks();
  document.getElementById('lockMsg').textContent='Войдите, чтобы открыть список';
  document.getElementById('pwErr').textContent='';
  document.getElementById('gsi').style.display='flex';
  document.getElementById('signout').style.display='none';
}
function showDenied(email){
  document.getElementById('lock').classList.remove('hidden');
  document.getElementById('app').style.display='none';
  document.getElementById('lockMsg').textContent='Нет доступа'+(email?(' для '+email):'');
  document.getElementById('pwErr').textContent='Этот аккаунт не в списке. Попросите добавить его.';
  document.getElementById('gsi').style.display='none';
  document.getElementById('signout').style.display='block';
}
/* Вызывается из Firebase-модуля при изменении статуса входа */
window.onAuthChange = function(user){
  __authedUser = user;
  if(user){ showApp(); } else { showLogin(); }
};
function showApp(){
  document.getElementById('lock').classList.add('hidden');
  document.getElementById('app').style.display='block';
  if(!window.__built){ window.__built=true; render(); registerSW(); startCloud(); }
  updateAvatar();
  if(__authedUser && !getProfName()){ openProfile(true); }
}
function registerSW(){
  if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
}

/* ================= МОДЕЛЬ =================
   Содержимого в коде нет — весь список приходит из базы (Firestore).
   Пустой старт нужен только для самого первого запуска на новом устройстве. */
const KEY="abkhazia_v2";
let uid=1; const nid=()=> 'i'+(Date.now().toString(36))+(uid++);
function tid(){ return 't'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function newTrip(o){ o=o||{}; return {id:tid(), location:o.location||'Поездка', dateFrom:o.dateFrom||'', dateTo:o.dateTo||'', createdAt:o.createdAt||Date.now(), model:o.model||[]}; }
function freshState(){ return {v:2, activeTripId:null, trips:[]}; }
/* Заворачиваем старый формат (просто массив категорий) в первую поездку. Идемпотентно. */
function migrate(raw){
  if(Array.isArray(raw)){ const t=newTrip({location:'Абхазия', model:raw}); return {v:2, activeTripId:t.id, trips:[t]}; }
  if(raw && raw.v>=2 && Array.isArray(raw.trips)) return raw;
  return freshState();
}
let STATE, MODEL=[];
const TPL_ID='__tpl__';
function getTemplate(){ return STATE.trips.find(t=>t.kind==='template'); }
function getTemplates(){ return STATE.trips.filter(t=>t.kind==='template'); }
function realTrips(){ return STATE.trips.filter(t=>t.kind!=='template'); }
function isTemplate(t){ return !!t && t.kind==='template'; }
/* (Не используется автоматически — все шаблоны равны, создаются вручную.)
   Оставлено как хелпер: заполняет шаблон из текущего/первого списка. */
function ensureTemplate(){
  if(getTemplate()) return;
  const seedFrom = realTrips().find(t=>t.id===STATE.activeTripId) || realTrips()[0];
  const model = (seedFrom && seedFrom.model && seedFrom.model.length) ? cloneModel(seedFrom.model) : [];
  STATE.trips.push({ id:TPL_ID, kind:'template', location:'Шаблон', dateFrom:'', dateTo:'', createdAt:0, model });
}
function activeTrip(){ return STATE.trips.find(t=>t.id===STATE.activeTripId) || realTrips()[0] || STATE.trips[0] || null; }
function syncModelRef(){ const t=activeTrip(); if(t) STATE.activeTripId=t.id; MODEL = t ? t.model : []; }
function normalize(){ syncModelRef(); }
function load(){ try{const s=localStorage.getItem(KEY); if(s){ STATE=migrate(JSON.parse(s)); normalize(); return; }}catch(e){} STATE=freshState(); normalize(); }
/* Весь STATE лежит одним документом в Firestore; лимит документа — 1 МиБ.
   Берём с запасом 1 000 000 байт и предупреждаем при заполнении на 80%. */
const STORE_LIMIT=1000000;
let __storeWarned=false;
function stateBytes(){ try{ return new Blob([JSON.stringify(STATE)]).size; }catch(e){ return 0; } }
function checkStorage(bytes){
  if(bytes>=STORE_LIMIT*0.8 && !__storeWarned){ __storeWarned=true;
    setTimeout(()=>alert('⚠️ Облачное хранилище заполнено на '+Math.round(bytes/STORE_LIMIT*100)+'% (лимит ~1 МБ).\nУдалите старые поездки и шаблоны — иначе синхронизация перестанет сохранять изменения.\nТекущее заполнение видно в Профиле.'),100); }
}
function save(){ localUpdatedAt=Date.now();
  let bytes=0;
  try{ const s=JSON.stringify(STATE); bytes=new Blob([s]).size;
    localStorage.setItem(KEY,s); localStorage.setItem(KEY+"_ts",String(localUpdatedAt)); }catch(e){}
  checkStorage(bytes); pushCloud(); }
load();
let localUpdatedAt=0; try{ localUpdatedAt=parseInt(localStorage.getItem(KEY+"_ts")||"0",10)||0; }catch(e){}
const myId=Math.random().toString(36).slice(2);

/* ===== ОБЛАЧНАЯ СИНХРОНИЗАЦИЯ (Firebase) ===== */
let __pushTimer=null;
function pushCloud(){
  if(!window.CLOUD) return;
  clearTimeout(__pushTimer);
  __pushTimer=setTimeout(()=>{ try{ window.CLOUD.push({data:JSON.stringify(STATE),updatedAt:localUpdatedAt,writer:myId}); }catch(e){} }, 400);
}
function startCloud(){
  const go=()=>{
    if(!window.CLOUD) return;
    window.CLOUD.subscribe(d=>{
      if(!d){ if(!localUpdatedAt) localUpdatedAt=Date.now(); pushCloud(); return; }
      if(d.writer===myId) return;
      if((d.updatedAt||0) >= localUpdatedAt){
        let parsed; try{ parsed=JSON.parse(d.data); }catch(e){ return; }
        STATE=migrate(parsed); normalize();
        localUpdatedAt=d.updatedAt||Date.now();
        try{ localStorage.setItem(KEY,JSON.stringify(STATE)); localStorage.setItem(KEY+"_ts",String(localUpdatedAt)); }catch(e){}
        if((active===null || !MODEL.some(p=>p.key===active)) && MODEL.length) active=MODEL[0].key;
        /* Пришёл снапшот во время перетаскивания — не перестраиваем DOM под пальцем */
        if(drag){ pendingRemoteRender=true; }
        else { render(); if(tripsOpen) renderTrips(); }
      } else { pushCloud(); }
    }, (e)=>{
      if(e && e.code==='permission-denied'){ showDenied(__authedUser && __authedUser.email); }
    });
  };
  if(window.CLOUD){ go(); } else { window.addEventListener('cloud-ready', go, {once:true}); }
}

/* ================= РЕНДЕР ================= */
const CHECK='<svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const pagesEl=document.getElementById('pages');
const tabsEl=document.getElementById('tabs');
let active = MODEL[0] ? MODEL[0].key : null;
let hideDone=false; try{ hideDone=localStorage.getItem('hide_done')==='1'; }catch(e){}
function toggleHideDone(){ hideDone=!hideDone; try{ localStorage.setItem('hide_done', hideDone?'1':'0'); }catch(e){} render(); }
const openState={};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function render(){
  renderTripHeader();
  if(MODEL.length && !MODEL.some(p=>p.key===active)) active=MODEL[0].key;
  pagesEl.innerHTML=''; tabsEl.innerHTML='';
  if(!MODEL.length){
    const noTrips=!realTrips().length && !getTemplate();
    const tplActive=isTemplate(activeTrip());
    pagesEl.innerHTML = noTrips
      ? '<div class="loading">Загрузка… или создайте поездку, нажав «🧳» вверху.</div>'
      : '<div class="loading">'+(tplActive
          ? 'Шаблон пуст. Добавьте категории и пункты — это станет основой для новых поездок.'
          : 'В этой поездке пока нет категорий.')

    document.getElementById('totalBar').style.width='0%';
    document.getElementById('totalLbl').textContent='—';
    document.getElementById('hint').textContent='';
    return;
  }
  MODEL.forEach(p=>{
    const page=document.createElement('div');
    page.className='page'+(p.key===active?' on':''); page.id='page-'+p.key;
    let html='';
    p.groups.forEach((g,gi)=>{
      if(typeof g.sub==='string'){
        html+=`<div class="sub" data-gi="${gi}"><span class="sub-tx">${esc(g.sub)}</span>
          <span class="sub-acts">
            <button onclick="openSubEditor(event,'${p.key}',${gi})">✎</button>

          </span></div>`;
        return;
      }
      const gk=p.key+'-'+gi;
      const closed=openState[gk]===false?' closed':'';
      html+=`<div class="group${closed}" data-gk="${gk}" data-gi="${gi}">
        <div class="g-head" onclick="toggleGroup('${gk}')">
          <span class="emo">${esc(g.emo||'')}</span><span class="ttl">${esc(g.title)}</span>
          <span class="g-acts">
            <button onclick="openGroupEditor(event,'${p.key}',${gi})">✎</button>
            <button class="del" onclick="deleteGroup(event,'${p.key}',${gi})">✕</button>
            <button class="ghandle" onpointerdown="onGroupHandleDown(event,'${p.key}',${gi})">≡</button>
          </span>
          <span class="cnt" id="cnt-${gk}"></span><span class="chev">▼</span>
        </div><div class="items">`;
      let disp=g.items.slice();
      if(hideDone) disp=disp.filter(it=>!it.done);
      else disp.sort((a,b)=>(a.done?1:0)-(b.done?1:0));
      disp.forEach(it=>{
        const note=it.n?`<span class="note">${esc(it.n)}</span>`:'';
        html+=`<div class="item${it.done?' checked':''}" data-id="${it.id}" data-gi="${gi}" onpointerdown="onItemPointerDown(event,'${it.id}')">
          <span class="box" onclick="boxTap(event,'${it.id}')">${CHECK}</span>
          <div class="lbl-wrap" onclick="openTaskEdit('${it.id}')"><span class="lbl">${esc(it.t)}</span>${note}</div>
          <span class="acts"><button class="act del" onclick="delItem(event,'${it.id}')">✕</button></span>
          <button class="drag" onpointerdown="onHandleDown(event,'${it.id}')">≡</button>
        </div>`;
      });
      html+=`<div class="additem" onclick="openTaskNew('${p.key}',${gi})"><span class="plus">＋</span><span class="addtx">Добавить задачу</span></div></div></div>`;
    });
    html+=`<div class="newgrp" onclick="openGroupEditor(null,'${p.key}',null)">＋ Подкатегория</div>`;
    html+=`<div class="newsub" onclick="openSubEditor(null,'${p.key}',null)">＋ Заголовок-раздел</div>`;
    page.innerHTML=html; pagesEl.appendChild(page);
    const btn=document.createElement('button');
    btn.dataset.p=p.key; if(p.key===active) btn.classList.add('on');
    btn.innerHTML=`<span class="ic">${esc(p.icon||'📋')}</span><span class="tx">${esc(p.tab)}</span><span class="dot" id="dot-${p.key}"></span>`;
    btn.onclick=()=>go(p.key); tabsEl.appendChild(btn);
  });
  document.getElementById('hint').textContent = document.body.classList.contains('editmode')
    ? 'Правка: ✎ изменить, ✕ удалить, ≡ или долгое нажатие — перетащить. Ниже — «＋ Подкатегория» и «＋ Заголовок-раздел».'
    : 'Нажмите на задачу, чтобы открыть её. «Править» — заголовки-разделы, подкатегории и порядок.';
  refresh();
}
function findItem(id){ for(const p of MODEL) for(const g of p.groups) if(g.items) for(const it of g.items) if(it.id===id) return {it,g,p}; return null; }
function toggleGroup(gk){ openState[gk]=!(openState[gk]!==false); document.querySelector(`.group[data-gk="${gk}"]`).classList.toggle('closed'); }
let justDragged=false;
function boxTap(e,id){
  e.stopPropagation();

  f.it.done=!f.it.done; /* выполненные уходят вниз при рендере */
  save(); render();
}
function delItem(e,id){ e.stopPropagation(); const f=findItem(id); if(!f) return;
  if(!confirm("Удалить: «"+f.it.t+"»?")) return; f.g.items=f.g.items.filter(x=>x.id!==id); save(); render(); }

/* ---- Окно задачи (Todoist-стиль) ---- */
let tsMode='new', tsId=null, tsPk=null, tsGi=null;
/* Счётчик, а не флаг: поверх профиля может открыться bottom-sheet —
   его закрытие не должно разблокировать фон, пока профиль ещё открыт. */
let scrollLocks=0;
function lockScroll(on){
  scrollLocks=Math.max(0, scrollLocks+(on?1:-1));
  document.body.classList.toggle('noscroll', scrollLocks>0);
}
function resetScrollLocks(){ scrollLocks=0; document.body.classList.remove('noscroll'); }
/* Открытие/закрытие sheet-окна с парным lockScroll. Флаг data-open ставится
   синхронно (класс .show появляется только через rAF) — защита от двойного
   открытия/закрытия, чтобы счётчик блокировки не разъезжался. */
function openSheetEl(s){
  if(s.dataset.open==='1') return; s.dataset.open='1';
  s.classList.remove('hidden'); lockScroll(true);
  requestAnimationFrame(()=>s.classList.add('show'));
}
function closeSheetEl(s){
  if(s.dataset.open!=='1') return; s.dataset.open='';
  s.classList.remove('show'); lockScroll(false);
  setTimeout(()=>{ if(s.dataset.open!=='1') s.classList.add('hidden'); },220);
}
function openTS(){ openSheetEl(document.getElementById('tsheet')); }
function closeTaskSheet(){ closeSheetEl(document.getElementById('tsheet')); }
function openTaskEdit(id){
  if(justDragged) return;

  tsMode='edit'; tsId=id;
  document.getElementById('tsTitle').textContent='Задача';

function openTaskNew(pk,gi){

function saveTaskSheet(){

  else { const p=MODEL.find(x=>x.key===tsPk); if(p&&p.groups[tsGi]){ (p.groups[tsGi].items||(p.groups[tsGi].items=[])).unshift({id:nid(),t,n,done:false}); } }

function deleteTaskFromSheet(){
  if(tsMode!=='edit'||!tsId) return;
  const f=findItem(tsId); if(!f) return;
  if(!confirm('Удалить задачу «'+f.it.t+'»?')) return;

}

function openVS(){ openSheetEl(document.getElementById('vsheet')); }
function closeViewSheet(){ closeSheetEl(document.getElementById('vsheet')); }

  });
  document.getElementById('vsBody').innerHTML = html ? (`<div class="tc-lbl" style="margin:0 0 6px">Взято ${done} из ${total}</div>`+html) : '<div class="trips-empty">Пусто</div>';

function go(pk){ active=pk;
  document.querySelectorAll('.page').forEach(p=>p.classList.toggle('on',p.id==='page-'+pk));
  [...tabsEl.children].forEach(b=>b.classList.toggle('on',b.dataset.p===pk)); window.scrollTo({top:0}); }
function openViewCurrent(){ if(active) openViewSheet(active); }
function toggleEdit(){ const on=document.body.classList.toggle('editmode');
  document.getElementById('hint').textContent=on
    ?'Правка: ✎ изменить, ✕ удалить, ≡ или долгое нажатие — перетащить. Ниже — «＋ Подкатегория» и «＋ Заголовок-раздел».'
    :'Нажмите на задачу, чтобы открыть её. «Править» — заголовки-разделы, подкатегории и порядок.'; }
function refresh(){
  let T=0,D=0;
  MODEL.forEach(p=>{ let pt=0,pd=0;
    p.groups.forEach((g,gi)=>{ if(!g.items) return; let gt=0,gd=0;
      g.items.forEach(it=>{gt++; if(it.done)gd++;}); pt+=gt; pd+=gd;
      const c=document.getElementById(`cnt-${p.key}-${gi}`);
      if(c){c.textContent=`${gd}/${gt}`; c.classList.toggle('full',gt>0&&gd===gt);} });
    T+=pt; D+=pd;
    const dot=document.getElementById('dot-'+p.key); const btn=[...tabsEl.children].find(b=>b.dataset.p===p.key);
    if(!dot||!btn) return;
    const rem=pt-pd;
    if(rem>0){dot.textContent=rem; dot.style.display='flex'; btn.classList.remove('done');}
    else{dot.textContent='✓'; dot.style.display=pt>0?'flex':'none'; btn.classList.add('done');} });
  document.getElementById('totalBar').style.width=(T?D/T*100:0)+'%';
  document.getElementById('totalLbl').textContent=`${D} из ${T} · ${T?Math.round(D/T*100):0}%`;
  const dt=document.getElementById('doneToggle');
  if(dt){ dt.textContent = hideDone ? ('Показать выполненные'+(D?` (${D})`:'')) : 'Скрыть выполненные';
    dt.classList.toggle('hidden', D===0 && !hideDone); }
}

/* ================= ПОЕЗДКИ ================= */
const MON=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
function pd(s){ if(!s) return null; const d=new Date(s+'T00:00:00'); return isNaN(d.getTime())?null:d; }
function pad2(n){ return (n<10?'0':'')+n; }
function fmtOne(s){ const d=pd(s); return d? d.getDate()+'.'+pad2(d.getMonth()+1)+'.'+String(d.getFullYear()).slice(-2) : ''; }
function fmtRange(a,b){
  if(!a&&!b) return '';
  if(a&&b){ if(a===b) return fmtOne(a); return fmtOne(a)+' – '+fmtOne(b); }
  return fmtOne(a||b);
}
function tripSortKey(t){ return t.dateFrom || t.dateTo || ''; }
function sortTrips(arr){ return arr.slice().sort((a,b)=>{
  const ka=tripSortKey(a), kb=tripSortKey(b);
  if(ka&&kb){ if(ka!==kb) return kb<ka?-1:1; return (b.createdAt||0)-(a.createdAt||0); }
  if(ka) return -1; if(kb) return 1;
  return (b.createdAt||0)-(a.createdAt||0);
}); }
function plural(n,one,few,many){ const m=n%100; if(m>=11&&m<=14) return many; const d=n%10; if(d===1) return one; if(d>=2&&d<=4) return few; return many; }
function countdown(t){
  const today=new Date(); today.setHours(0,0,0,0);
  const from=pd(t.dateFrom), to=pd(t.dateTo)||from;
  if(from){ const diff=Math.round((from-today)/86400000);
    if(diff>1) return '⏳ '+diff+' '+plural(diff,'день','дня','дней');
    if(diff===1) return '⏳ завтра';
    if(diff===0) return '🎒 сегодня старт'; }
  if(to){ const dt=Math.round((to-today)/86400000);
    return dt>=0 ? '🧭 в поездке' : '✓ завершена'; }
  return '';
}
function renderTripHeader(){
  const t=activeTrip(); const tpl=isTemplate(t);
  document.getElementById('tripName').textContent = t ? (tpl?(t.location||'Шаблон'):t.location) : 'Поездка';
  const meta=document.getElementById('tripMeta');
  if(!t){ meta.innerHTML=''; return; }
  if(tpl){ meta.innerHTML='<span class="cd">📋 Шаблон · основа для поездок</span>'; return; }
  const dates=fmtRange(t.dateFrom,t.dateTo), cd=countdown(t);
  meta.innerHTML = (dates?esc(dates):'') + (dates&&cd?' · ':'') + (cd?`<span class="cd">${esc(cd)}</span>`:'');
}
let tripsOpen=false, tripsTab='trips';
function openTrips(){ if(tripsOpen) return; tripsOpen=true; if(isTemplate(activeTrip())) tripsTab='templates'; setTripsTab(tripsTab); document.getElementById('trips').classList.remove('hidden'); lockScroll(true); document.getElementById('trips').scrollTop=0; }
function closeTrips(){ if(!tripsOpen) return; tripsOpen=false; document.getElementById('trips').classList.add('hidden'); lockScroll(false); }
function setTripsTab(tab){ tripsTab=tab;
  document.getElementById('ttTrips').classList.toggle('on',tab==='trips');
  document.getElementById('ttTpl').classList.toggle('on',tab==='templates');
  renderTrips();
}
function tripProgress(t){ let T=0,D=0; (t.model||[]).forEach(p=>p.groups&&p.groups.forEach(g=>g.items&&g.items.forEach(it=>{T++; if(it.done)D++;}))); return {D,T}; }
function renderTrips(){
  const list=document.getElementById('tripList');
  let html='';
  if(tripsTab==='templates'){
    html+=`<button class="newtrip-btn" onclick="openNewTemplate()">＋ Новый шаблон</button>`;
    const tpls=getTemplates();
    if(!tpls.length){ html+='<div class="trips-empty">Пока нет шаблонов.<br>Нажмите «＋ Новый шаблон».</div>'; }
    else html+=tpls.map(t=>{
      const {T}=tripProgress(t); const act=t.id===STATE.activeTripId;
      return `<div class="trip-card tpl${act?' active':''}" data-tpl="${t.id}" onclick="switchTrip('${t.id}')">
        <div class="tc-top"><button class="ghandle" onpointerdown="onTplHandleDown(event,'${t.id}')">≡</button><span class="tc-name">📋 ${esc(t.location||'Шаблон')}</span>${act?'<span class="tc-badge">открыт</span>':''}</div>
        <div class="tc-dates">${T} ${plural(T,'пункт','пункта','пунктов')}</div>
        <div class="tc-acts">
          <button onclick="openEditTrip(event,'${t.id}')">✎ Переименовать</button>
          <button onclick="duplicateTrip(event,'${t.id}')">⧉ Копия</button>
          <button class="del" onclick="deleteTrip(event,'${t.id}')">✕</button>
        </div>
      </div>`;
    }).join('');
  } else {
    html+=`<button class="newtrip-btn" onclick="openNewTrip()">＋ Новая поездка</button>`;
    const trips=sortTrips(realTrips());
    if(!trips.length){ html+='<div class="trips-empty">Пока нет поездок.<br>Нажмите «＋ Новая поездка», чтобы создать первую.</div>'; }
    else html+=trips.map(t=>{
      const {D,T}=tripProgress(t); const pct=T?Math.round(D/T*100):0;
      const act=t.id===STATE.activeTripId; const dates=fmtRange(t.dateFrom,t.dateTo);
      return `<div class="trip-card${act?' active':''}" onclick="switchTrip('${t.id}')">
        <div class="tc-top"><span class="tc-name">🧳 ${esc(t.location)}</span>${act?'<span class="tc-badge">открыта</span>':''}</div>
        ${dates?`<div class="tc-dates">${esc(dates)}</div>`:''}
        <div class="tc-bar"><i style="width:${pct}%"></i></div>
        <div class="tc-lbl">${D} из ${T} · ${pct}%</div>
        <div class="tc-acts">
          <button onclick="openEditTrip(event,'${t.id}')">✎ Изменить</button>
          <button onclick="duplicateTrip(event,'${t.id}')">⧉ Копия</button>
          <button onclick="makeTemplateFromTrip(event,'${t.id}')">📋 Шаблон</button>
          <button class="del" onclick="deleteTrip(event,'${t.id}')">✕</button>
        </div>
      </div>`;
    }).join('');
  }
  list.innerHTML=html;
}
function openNewTemplate(){

  document.getElementById('sheetSave').textContent='Создать';

/* Создать шаблон из существующей поездки (галочки сброшены). Новый — вверху списка шаблонов. */
function makeTemplateFromTrip(e,id){ e.stopPropagation();
  const src=STATE.trips.find(x=>x.id===id); if(!src) return;
  const t={id:tid(), kind:'template', location:src.location||'Шаблон', dateFrom:'', dateTo:'', createdAt:Date.now(), model:cloneModel(src.model)};
  STATE.trips.unshift(t);
  save(); tripsTab='templates'; setTripsTab('templates');
  alert('Шаблон «'+t.location+'» создан. Он на вкладке «Шаблоны».');

function switchTrip(id){
  if(justDragged) return;
  const t=STATE.trips.find(x=>x.id===id); if(!t) return;

  active = MODEL[0] ? MODEL[0].key : null;
  save(); closeTrips(); render(); window.scrollTo({top:0});
}
/* Глубокая копия структуры поездки: новые id, галочки сброшены */
function cloneModel(model){
  return (model||[]).map(p=>({
    key:'c'+Date.now().toString(36)+(uid++),
    icon:p.icon||'📋', tab:p.tab||'', title:p.title||'', intro:p.intro||'',
    groups:(p.groups||[]).map(g=>{
      const ng={...g};
      if(ng.items) ng.items=ng.items.map(it=>({id:nid(), t:it.t, n:it.n||'', done:false}));
      return ng;
    })
  }));
}
/* --- Bottom sheet: новая / изменить поездку --- */
let sheetMode='new', sheetTripId=null, sheetSource='empty';
function openSheet(){ openSheetEl(document.getElementById('sheet')); }
function closeSheet(){ closeSheetEl(document.getElementById('sheet')); }

function openEditTrip(e,id){ e.stopPropagation();

  document.querySelector('#sheet .fld-row').style.display=tpl?'none':'';

function saveSheet(){
  const loc=document.getElementById('fLoc').value.trim();
  if(!loc){ document.getElementById('fLoc').focus(); return; }
  const from=document.getElementById('fFrom').value||'';
  const to=document.getElementById('fTo').value||'';
  if(from&&to&&to<from){ alert('Дата конца раньше даты начала.'); return; }
  if(sheetMode==='edit'){
    const t=STATE.trips.find(x=>x.id===sheetTripId);
    if(t){ t.location=loc; t.dateFrom=from; t.dateTo=to; }
    save(); closeSheet(); renderTrips(); renderTripHeader();
    return;
  }

/* ===== Перетаскивание (задачи, подкатегории/заголовки, категории, шаблоны) =====
   Клон двигается через transform (GPU, без reflow), проверка позиции — раз в кадр
   (rAF) и только при реальной смене места (защита от дребезга/мельтешения).
   Выделение текста и callout отключаются на время перетаскивания. */
function haptic(){ try{ if(navigator.vibrate) navigator.vibrate(12); }catch(e){} }
function clearSel(){ try{ const s=window.getSelection&&window.getSelection(); if(s&&s.removeAllRanges) s.removeAllRanges(); }catch(e){} }
let drag=null, lastPt={x:0,y:0}, dragRaf=false, dragPt={x:0,y:0}, pendingRemoteRender=false;
function startLongPress(e, onFire){
  const sx=e.clientX, sy=e.clientY; lastPt={x:sx,y:sy};
  const timer=setTimeout(()=>{ cleanup(); haptic(); onFire(); }, 230);
  const mv=(ev)=>{ lastPt={x:ev.clientX,y:ev.clientY}; if(Math.abs(ev.clientX-sx)>8||Math.abs(ev.clientY-sy)>8){ clearTimeout(timer); cleanup(); } };
  const up=()=>{ clearTimeout(timer); cleanup(); };
  function cleanup(){ window.removeEventListener('pointermove',mv); window.removeEventListener('pointerup',up); window.removeEventListener('pointercancel',up); }
  window.addEventListener('pointermove',mv,{passive:true});
  window.addEventListener('pointerup',up); window.addEventListener('pointercancel',up);
}
function mkClone(el,r){ const c=el.cloneNode(true); c.classList.add('drag-clone');
  c.style.cssText+=`position:fixed;z-index:200;pointer-events:none;margin:0;width:${r.width}px;left:${r.left}px;top:${r.top}px;opacity:.97;box-shadow:0 12px 30px rgba(40,30,10,.24);will-change:transform`;
  return c; }
/* iOS Safari: preventDefault в pointermove НЕ останавливает нативный скролл —
   на время драга глушим touchmove не-пассивным слушателем. */
function blockTouchScroll(e){ e.preventDefault(); }
function attachDrag(){
  window.addEventListener('pointermove', onDragMove, {passive:false});
  window.addEventListener('touchmove', blockTouchScroll, {passive:false});
  window.addEventListener('pointerup', onDragUp, {once:true});
  window.addEventListener('pointercancel', onDragUp, {once:true});
}
function autoScroll(y){ const m=80; let cont=null;
  if(drag&&drag.kind==='cat') cont=document.getElementById('profile');
  else if(drag&&drag.kind==='tpl') cont=document.getElementById('trips');
  if(cont){ if(y<m+70) cont.scrollBy(0,-14); else if(y>window.innerHeight-m) cont.scrollBy(0,14); }
  else { if(y<m) window.scrollBy(0,-14); else if(y>window.innerHeight-m) window.scrollBy(0,14); } }
function onDragMove(e){
  if(!drag) return; e.preventDefault();
  dragPt={x:e.clientX,y:e.clientY};
  drag.clone.style.transform='translate3d('+(e.clientX-drag.startX)+'px,'+(e.clientY-drag.startY)+'px,0)';
  if(dragRaf) return; dragRaf=true;
  requestAnimationFrame(()=>{ dragRaf=false; if(!drag) return;
    autoScroll(dragPt.y);
    if(drag.kind==='item') itemDragOver(dragPt.x,dragPt.y);
    else if(drag.kind==='group') groupDragOver(dragPt.x,dragPt.y);
    else if(drag.kind==='cat') catDragOver(dragPt.x,dragPt.y);
    else if(drag.kind==='tpl') tplDragOver(dragPt.x,dragPt.y);
  });
}
function onDragUp(){
  window.removeEventListener('pointermove', onDragMove);
  window.removeEventListener('touchmove', blockTouchScroll);
  document.body.classList.remove('dragging');
  if(!drag) return; const d=drag; drag=null;
  if(d.clone) d.clone.remove();
  if(d.ph) d.ph.remove();
  if(d.el) d.el.style.display='';
  if(d.kind==='item') applyItemDrop(d);
  else if(d.kind==='group') applyGroupDrop(d);
  else if(d.kind==='cat') applyCatDrop(d);
  else if(d.kind==='tpl') applyTplDrop(d);
  if(pendingRemoteRender){ pendingRemoteRender=false; render(); if(tripsOpen) renderTrips(); if(profileOpen) renderProfileCats(); }
  justDragged=true; setTimeout(()=>{ justDragged=false; }, 350);
}
/* Палец над самим плейсхолдером: elementFromPoint проваливается сквозь него
   (pointer-events:none) в контейнер — раньше это запускало петлю «прыжок
   в конец группы → прыжок обратно» и давало дребезг. Теперь просто ничего не делаем. */
function overPh(x,y){
  if(!drag||!drag.ph||!drag.ph.parentNode) return false;
  const r=drag.ph.getBoundingClientRect();
  return y>=r.top && y<=r.bottom && x>=r.left-20 && x<=r.right+20;
}
/* Гистерезис: у середины строки — «мёртвая зона», без явного пересечения не переключаемся */
function midAfter(rect,y){
  const mid=rect.top+rect.height/2, dz=Math.min(12,rect.height*0.25);
  if(Math.abs(y-mid)<=dz) return null;
  return y>mid;
}
/* Двигаем плейсхолдер только если он реально должен встать в другое место.
   Сдвиг соседних строк анимируется (FLIP): вместо телепорта — плавный переезд. */
function placePhAt(parent, refNode){
  if(!parent || refNode===drag.ph) return;
  if(drag.ph.parentNode===parent && drag.ph.nextSibling===refNode) return;
  const affected=new Set();
  const grab=p=>{ if(p) for(const ch of p.children){ if(ch!==drag.ph && ch.style.display!=='none') affected.add(ch); } };
  grab(drag.ph.parentNode); grab(parent);
  const before=new Map(); affected.forEach(el=>before.set(el, el.getBoundingClientRect().top));
  parent.insertBefore(drag.ph, refNode);
  affected.forEach(el=>{
    const dy=before.get(el)-el.getBoundingClientRect().top;
    if(Math.abs(dy)<1) return;
    el.style.transition='none'; el.style.transform='translateY('+dy+'px)';
    requestAnimationFrame(()=>{ el.style.transition='transform .15s ease'; el.style.transform=''; });
  });
}
function placePh(over, refNode){ placePhAt(over.parentNode, refNode); }
function beginDragCommon(){ document.body.classList.add('dragging'); clearSel(); }
/* --- задачи --- */
function onItemPointerDown(e,id){
  if(!document.body.classList.contains('editmode')) return;
  if(e.target.closest('button')||e.target.closest('.box')||e.target.closest('.drag')) return;
  startLongPress(e, ()=>beginItemDrag(id, lastPt.x, lastPt.y));
}
function onHandleDown(e,id){ e.preventDefault(); e.stopPropagation(); beginItemDrag(id, e.clientX, e.clientY); }
function beginItemDrag(id, x, y){
  const el=document.querySelector('.item[data-id="'+id+'"]'); if(!el) return;
  const pageEl=el.closest('.page'); const r=el.getBoundingClientRect();
  const clone=mkClone(el,r); document.body.appendChild(clone);
  const ph=document.createElement('div'); ph.className='drag-ph'; ph.style.height=r.height+'px';
  el.parentNode.insertBefore(ph, el); el.style.display='none';
  beginDragCommon();
  drag={kind:'item', id, el, pageEl, clone, ph, startX:x, startY:y, target:null};
  attachDrag();
}
function itemDragOver(x,y){
  if(overPh(x,y)) return;
  const el=document.elementFromPoint(x,y); if(!el||!el.closest) return;
  const over=el.closest('.item');
  if(over && over!==drag.el && !over.classList.contains('drag-clone') && over.style.display!=='none' && drag.pageEl.contains(over)){
    const rect=over.getBoundingClientRect(); const after=midAfter(rect,y);
    if(after===null) return;
    placePh(over, after?over.nextSibling:over);
    drag.target={refId:over.dataset.id, after}; return;
  }
  const grp=el.closest('.group');
  if(grp && drag.pageEl.contains(grp)){
    const box=grp.querySelector('.items'); if(!box) return;
    /* «в конец группы» — только если палец ниже последней видимой задачи (или группа пуста),
       иначе заголовок/зазоры группы утаскивали плейсхолдер вниз и он дребезжал */
    const items=[...box.querySelectorAll('.item')].filter(n=>n!==drag.el && n.style.display!=='none');
    const last=items[items.length-1];
    if(last && y<=last.getBoundingClientRect().bottom) return;
    placePhAt(box, box.querySelector('.additem'));
    drag.target={groupGi:parseInt(grp.dataset.gi,10)};
  }
}
function applyItemDrop(d){
  const src=findItem(d.id); if(!src){ render(); return; }
  const from=src.g.items; const origIdx=from.indexOf(src.it); from.splice(origIdx,1);
  const t=d.target;
  if(t&&t.refId!=null){ const rf=findItem(t.refId); if(rf){ const arr=rf.g.items; let i=arr.indexOf(rf.it); if(t.after)i++; arr.splice(i,0,src.it); save(); render(); return; } }
  if(t&&t.groupGi!=null && src.p.groups[t.groupGi]){ const g=src.p.groups[t.groupGi]; (g.items||(g.items=[])).push(src.it); save(); render(); return; }
  from.splice(origIdx,0,src.it); render(); /* цели нет — вернуть на исходное место, ничего не менять */
}
/* --- подкатегории и заголовки-разделы --- */
function onGroupHandleDown(e,pk,gi){ e.preventDefault(); e.stopPropagation();
  const el=e.target.closest('.group,.sub'); beginGroupDrag(pk,gi,el,e.clientX,e.clientY); }
function beginGroupDrag(pk,gi,el,x,y){
  const p=MODEL.find(z=>z.key===pk); if(!p||!el) return;
  const pageEl=el.closest('.page'); const r=el.getBoundingClientRect();
  const clone=mkClone(el,r); document.body.appendChild(clone);
  const ph=document.createElement('div'); ph.className='drag-ph grp'; ph.style.height=r.height+'px';
  el.parentNode.insertBefore(ph, el); el.style.display='none';
  beginDragCommon();
  drag={kind:'group', p, srcObj:p.groups[gi], pageEl, el, clone, ph, startX:x, startY:y, target:null};
  attachDrag();
}
function groupDragOver(x,y){
  if(overPh(x,y)) return;
  const el=document.elementFromPoint(x,y); if(!el||!el.closest) return;
  const over=el.closest('.group')||el.closest('.sub');
  if(over && over!==drag.el && !over.classList.contains('drag-clone') && over.dataset.gi!=null && drag.pageEl.contains(over)){
    const rect=over.getBoundingClientRect(); const after=midAfter(rect,y);
    if(after===null) return;
    placePh(over, after?over.nextSibling:over);
    drag.target={refObj: drag.p.groups[parseInt(over.dataset.gi,10)], after};
  }
}
function applyGroupDrop(d){
  const arr=d.p.groups; const si=arr.indexOf(d.srcObj); if(si<0){ render(); return; } arr.splice(si,1);
  const t=d.target;
  if(t&&t.refObj){ let i=arr.indexOf(t.refObj); if(i<0)i=arr.length; else if(t.after)i++; arr.splice(i,0,d.srcObj); }
  else arr.splice(Math.min(si,arr.length),0,d.srcObj);
  save(); render();
}
/* --- категории (в профиле) --- */
function onCatHandleDown(e,key){ e.preventDefault(); e.stopPropagation();
  const el=e.target.closest('.prof-cat'); beginCatDrag(key,el,e.clientX,e.clientY); }
function beginCatDrag(key,el,x,y){
  if(!el) return; const r=el.getBoundingClientRect();
  const clone=mkClone(el,r); document.body.appendChild(clone);
  const ph=document.createElement('div'); ph.className='drag-ph'; ph.style.height=r.height+'px'; ph.style.margin='0 0 8px';
  el.parentNode.insertBefore(ph, el); el.style.display='none';
  beginDragCommon();
  drag={kind:'cat', srcObj:MODEL.find(z=>z.key===key), container:el.parentNode, el, clone, ph, startX:x, startY:y, target:null};
  attachDrag();
}
function catDragOver(x,y){
  if(overPh(x,y)) return;
  const el=document.elementFromPoint(x,y); if(!el||!el.closest) return;
  const over=el.closest('.prof-cat');
  if(over && over!==drag.el && !over.classList.contains('drag-clone') && over.dataset.key && drag.container.contains(over)){
    const rect=over.getBoundingClientRect(); const after=midAfter(rect,y);
    if(after===null) return;
    placePh(over, after?over.nextSibling:over);
    drag.target={refObj: MODEL.find(z=>z.key===over.dataset.key), after};
  }
}
function applyCatDrop(d){
  const si=MODEL.indexOf(d.srcObj); if(si<0){ render(); renderProfileCats(); return; } MODEL.splice(si,1);
  const t=d.target;
  if(t&&t.refObj){ let i=MODEL.indexOf(t.refObj); if(i<0)i=MODEL.length; else if(t.after)i++; MODEL.splice(i,0,d.srcObj); }
  else MODEL.splice(Math.min(si,MODEL.length),0,d.srcObj);
  save(); render(); renderProfileCats();
}
/* --- шаблоны (на экране «Мои списки») --- */
function onTplHandleDown(e,id){ e.preventDefault(); e.stopPropagation();
  const el=e.target.closest('.trip-card'); beginTplDrag(id,el,e.clientX,e.clientY); }
function beginTplDrag(id,el,x,y){
  if(!el) return; const r=el.getBoundingClientRect();
  const clone=mkClone(el,r); document.body.appendChild(clone);
  const ph=document.createElement('div'); ph.className='drag-ph tplph'; ph.style.height=r.height+'px';
  el.parentNode.insertBefore(ph, el); el.style.display='none';
  beginDragCommon();
  drag={kind:'tpl', id, container:el.parentNode, el, clone, ph, startX:x, startY:y, target:null};
  attachDrag();
}
function tplDragOver(x,y){
  if(overPh(x,y)) return;
  const el=document.elementFromPoint(x,y); if(!el||!el.closest) return;
  const over=el.closest('.trip-card');
  if(over && over!==drag.el && !over.classList.contains('drag-clone') && over.dataset.tpl && drag.container.contains(over)){
    const rect=over.getBoundingClientRect(); const after=midAfter(rect,y);
    if(after===null) return;
    placePh(over, after?over.nextSibling:over);
    drag.target={refId:over.dataset.tpl, after};
  }
}
function applyTplDrop(d){
  const src=STATE.trips.find(t=>t.id===d.id); if(!src){ renderTrips(); return; }
  STATE.trips=STATE.trips.filter(t=>t!==src);
  const t=d.target;
  if(t&&t.refId){ let i=STATE.trips.findIndex(x=>x.id===t.refId); if(i<0)i=STATE.trips.length; else if(t.after)i++; STATE.trips.splice(i,0,src); }
  else STATE.trips.push(src);
  save(); renderTrips();
}

/* ===== Профиль ===== */
let profileOpen=false;
function profUid(){ return (__authedUser&&__authedUser.uid)||'anon'; }
function getProfName(){ try{ return localStorage.getItem('prof_'+profUid())||''; }catch(e){ return ''; } }
function setProfNameStore(v){ try{ localStorage.setItem('prof_'+profUid(), v); }catch(e){} }
function updateAvatar(){ const n=getProfName().trim(); const b=document.getElementById('profBtn'); if(b) b.textContent = n? n[0].toUpperCase() : '👤'; }
function openProfile(welcome){
  if(!profileOpen) lockScroll(true);
  profileOpen=true;
  const nm=getProfName() || (welcome && __authedUser && __authedUser.displayName ? __authedUser.displayName : '');
  document.getElementById('profName').value=nm;
  if(nm && welcome) setProfNameStore(nm);
  const h=document.getElementById('profHint');
  if(welcome){ h.style.display='block'; h.textContent='Добро пожаловать! Заполните имя — так вы и близкие будете видеть, чей это список.'; }
  else { h.style.display='none'; }
  const at=activeTrip();
  document.getElementById('profTripName').textContent = isTemplate(at)?'Шаблон':(at?at.location:'поездка');
  renderProfileCats(); renderStorage(); updateAvatar();
  document.getElementById('profile').classList.remove('hidden'); document.getElementById('profile').scrollTop=0;
}
function closeProfile(){ if(!profileOpen) return; profileOpen=false; document.getElementById('profile').classList.add('hidden'); lockScroll(false); }
function saveProfName(){ setProfNameStore(document.getElementById('profName').value.trim()); updateAvatar(); }
function renderStorage(){
  const el=document.getElementById('profStore'); if(!el) return;
  const used=stateBytes(); const pct=Math.min(100, Math.round(used/STORE_LIMIT*100));
  const warn=pct>=80;
  el.innerHTML=`<div class="tc-bar"><i style="width:${Math.max(pct,2)}%${warn?';background:var(--warn)':''}"></i></div>
    <div class="tc-lbl">${Math.round(used/1024)} КБ из ~977 КБ (${pct}%) — лимит облачного документа</div>`
    +(warn?'<div class="tc-lbl" style="color:var(--warn);font-weight:700">⚠️ Больше 80% — удалите старые поездки и шаблоны</div>':'');
}
function renderProfileCats(){
  const box=document.getElementById('profCats'); if(!box) return;
  if(!MODEL.length){ box.innerHTML='<div class="trips-empty" style="padding:12px 6px">Категорий пока нет. Нажмите «＋ Категория».</div>'; return; }
  box.innerHTML=MODEL.map(p=>`<div class="prof-cat" data-key="${p.key}">
    <button class="ghandle" onpointerdown="onCatHandleDown(event,'${p.key}')">≡</button>
    <span class="pc-emo">${esc(p.icon||'📋')}</span><span class="pc-name">${esc(p.tab||p.title||'Категория')}</span>
    <button onclick="openCatEditor('${p.key}')">✎</button>
    <button class="del" onclick="deleteCategory('${p.key}')">✕</button></div>`).join('');
}

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  const firebaseConfig = {
    apiKey: "AIzaSyDob_HdG-ihclIacDESG3sdISugCXAC43U",
    authDomain: "abkhazia-checklist.firebaseapp.com",
    projectId: "abkhazia-checklist",
    storageBucket: "abkhazia-checklist.firebasestorage.app",
    messagingSenderId: "199595946569",
    appId: "1:199595946569:web:da379b114ce5e099c10598"
  };
  try {
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const ref = doc(db, "checklists", "shared");
    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });

    window.AUTH = {
      signIn: async () => {
        // Только popup. signInWithRedirect на iOS/standalone даёт ошибку
        // "missing initial state ... storage-partitioned" — поэтому им не пользуемся.
        try { await signInWithPopup(auth, provider); }
        catch(e){ if(window.onSignInError) window.onSignInError(e && e.code); }
      },
      signOut: () => signOut(auth)
    };
    window.CLOUD = {
      push: (payload) => setDoc(ref, payload),
      subscribe: (cb, errCb) => onSnapshot(ref, snap => cb(snap.exists() ? snap.data() : null), (e) => { if(errCb) errCb(e); })
    };
    getRedirectResult(auth).catch(()=>{});
    onAuthStateChanged(auth, (user) => {
      if (window.onAuthChange) window.onAuthChange(user || null);
    });
    window.dispatchEvent(new Event('cloud-ready'));
  } catch(e) { /* нет сети / модуль не загрузился */ }
</script>
